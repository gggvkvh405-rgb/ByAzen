name: Build wByAzen

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Gradle 9.5.1
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-9.5.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-9.5.1/bin" >> $GITHUB_PATH
          gradle --version || /tmp/gradle-9.5.1/bin/gradle --version

      - name: Build remapped jar
        run: |
          cd wexside
          gradle build --no-daemon --stacktrace
          echo "=== build/libs ==="
          ls -lh build/libs/

      - name: Rename and commit jar to branch
        run: |
          CANDIDATES=$(ls wexside/build/libs/wByAzen-*.jar | grep -v -e '-sources' -e '-javadoc' -e '-dev' || true)
          echo "Candidates: $CANDIDATES"
          JAR=$(echo "$CANDIDATES" | head -n 1)
          if [ -z "$JAR" ]; then
            echo "ERROR: built jar not found"; ls -lh wexside/build/libs/; exit 1
          fi
          echo "Using $JAR"
          cp "$JAR" wByAzen.jar
          ls -lh wByAzen.jar
          unzip -p wByAzen.jar fabric.mod.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add wByAzen.jar
          git commit -m "Build wByAzen.jar from wexside sources" || echo "nothing to commit"
          git push origin HEAD:${{ github.ref_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wByAzen
          path: wByAzen.jar
