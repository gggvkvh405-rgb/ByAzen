name: Build ByAzen

on:
  push:
    branches:
      - 'arena/**'
      - 'main'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 9.5.1 --distribution-type bin

      - name: Build ByAzen
        run: gradle build --no-daemon --stacktrace

      - name: Show build output
        run: ls -la build/libs

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: byazen-build
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Publish jar into repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp build/libs/*.jar .
          git add -f -- '*.jar' gradle/wrapper/gradle-wrapper.jar gradlew gradlew.bat gradle/wrapper/gradle-wrapper.properties
          git commit -m "CI: ByAzen build output [skip ci]" || echo "nothing to commit"
          git push
