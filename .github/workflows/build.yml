name: Build ByAzen

on:
  push:
    branches:
      - 'arena/**'
      - 'main'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 9.5.1 --distribution-type bin

      - name: Build ByAzen
        run: |
          set -o pipefail
          gradle build --no-daemon --stacktrace 2>&1 | tee build-log.txt

      - name: Publish build log on failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f build-log.txt ]; then
            tail -c 120000 build-log.txt > build-log.trim
            mv build-log.trim build-log.txt
            git add -f -- build-log.txt
            git commit -m "CI: build log [skip ci]" || true
            git push || true
          fi

      - name: Show build output
        run: ls -la build/libs

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: byazen-build
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Publish jar into repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f ByAzen-*.jar
          cp build/libs/ByAzen-*.jar .
          # only the built jar (and wrapper files) - never build/ or .gradle/ caches
          git add -f -A -- './ByAzen-*.jar'
          git add -f -- gradle/wrapper/gradle-wrapper.jar gradlew gradlew.bat gradle/wrapper/gradle-wrapper.properties
          if git diff --cached --quiet; then
            echo "Nothing changed - jar is identical to the committed one"
          else
            git commit -m "CI: ByAzen build output [skip ci]"
            git push
          fi
