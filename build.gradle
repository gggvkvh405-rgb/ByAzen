plugins {
    id 'fabric-loom' version '1.17.19'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/'
    }
    maven {
        name = 'SpongePowered'
        url = 'https://repo.spongepowered.org/repository/maven-public/'
    }
}

loom {
    accessWidenerPath = file("src/main/resources/byazen.accesswidener")
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // MixinExtras
    compileOnly "io.github.llamalad7:mixinextras-common:0.5.3"
    annotationProcessor "io.github.llamalad7:mixinextras-common:0.5.3"
    implementation "io.github.llamalad7:mixinextras-fabric:0.5.3"
    include "io.github.llamalad7:mixinextras-fabric:0.5.3"

    // NightConfig (TOML & Core)
    implementation "com.electronwill.night-config:core:3.8.3"
    implementation "com.electronwill.night-config:toml:3.8.3"
    include "com.electronwill.night-config:core:3.8.3"
    include "com.electronwill.night-config:toml:3.8.3"

    // JLayer - онлайн-декодер MP3 для встроенного музыкального плеера (делает стриминг без скачивания)
    implementation "com.googlecode.soundlibs:jlayer:1.0.1.4"
    include "com.googlecode.soundlibs:jlayer:1.0.1.4"

    // Local libraries from libs/
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = "UTF-8"
    it.options.compilerArgs += ["-Xmaxerrs", "2000"]
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

// Byte-for-byte reproducible archives (jar is rebuilt identically if sources did not change)
tasks.withType(org.gradle.api.tasks.bundling.AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
