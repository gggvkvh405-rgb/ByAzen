plugins {
    id 'fabric-loom' version '1.17.19'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/'
    }
    maven {
        name = 'SpongePowered'
        url = 'https://repo.spongepowered.org/repository/maven-public/'
    }
    maven {
        name = 'JitPack'
        url = 'https://jitpack.io'
    }
    maven {
        name = 'Babbaj'
        url = 'https://babbaj.github.io/maven/'
    }
    maven {
        name = 'RedLance'
        url = 'https://repo.redlance.org/public'
    }
}

loom {
    accessWidenerPath = file("src/main/resources/kimiko.accesswidener")
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // MixinExtras
    compileOnly "io.github.llamalad7:mixinextras-common:0.5.3"
    annotationProcessor "io.github.llamalad7:mixinextras-common:0.5.3"
    implementation "io.github.llamalad7:mixinextras-fabric:0.5.3"
    include "io.github.llamalad7:mixinextras-fabric:0.5.3"

    // NightConfig (TOML & Core)
    implementation "com.electronwill.night-config:core:3.8.3"
    implementation "com.electronwill.night-config:toml:3.8.3"
    include "com.electronwill.night-config:core:3.8.3"
    include "com.electronwill.night-config:toml:3.8.3"

    // JNA (Discord RPC native bridge)
    implementation "net.java.dev.jna:jna:5.15.0"
    include "net.java.dev.jna:jna:5.15.0"

    // Twelvemonkeys ImageIO (WexSide WebP support)
    implementation "com.twelvemonkeys.imageio:common-image:3.12.0"
    include "com.twelvemonkeys.imageio:common-image:3.12.0"
    implementation "com.twelvemonkeys.imageio:common-io:3.12.0"
    include "com.twelvemonkeys.imageio:common-io:3.12.0"
    implementation "com.twelvemonkeys.imageio:common-lang:3.12.0"
    include "com.twelvemonkeys.imageio:common-lang:3.12.0"
    implementation "com.twelvemonkeys.imageio:imageio-core:3.12.0"
    include "com.twelvemonkeys.imageio:imageio-core:3.12.0"
    implementation "com.twelvemonkeys.imageio:imageio-webp:3.12.0"
    include "com.twelvemonkeys.imageio:imageio-webp:3.12.0"

    // Zenith runtime dependencies
    modImplementation "com.zigythebird.playeranim:PlayerAnimationLibFabric:1.1.6+mc.1.21.11"
    include "com.zigythebird.playeranim:PlayerAnimationLibFabric:1.1.6+mc.1.21.11"
    implementation "dev.babbaj:nether-pathfinder:1.6"
    include "dev.babbaj:nether-pathfinder:1.6"
    implementation "io.netty:netty-handler-proxy:4.2.7.Final"
    include "io.netty:netty-handler-proxy:4.2.7.Final"
    implementation "io.netty:netty-codec-socks:4.2.7.Final"
    include "io.netty:netty-codec-socks:4.2.7.Final"

    // Annotation-only (Zenith sources reference jspecify)
    compileOnly "org.jspecify:jspecify:1.0.0"

    // Local libraries from libs/ (shaded-runtime, baritone, zenith add-ons)
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = "UTF-8"
    it.options.compilerArgs += ["-Xmaxerrs", "2000"]
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

def bundledModJars = [
    'baritone-meteor-1.21.11.jar',
    'zenith-addon-api-1.0-SNAPSHOT.jar',
    'zenith-addon-runtime-1.0-SNAPSHOT.jar'
]

def sanitizeShadedRuntime = tasks.register('sanitizeShadedRuntime', Zip) {
    archiveFileName = 'shaded-runtime-sanitized.jar'
    destinationDirectory = layout.buildDirectory.dir('sanitized-libs')
    from(zipTree(file('libs/shaded-runtime.jar'))) {
        // Minecraft 1.21.11 supplies newer, binary-compatible versions.
        exclude 'org/apache/commons/lang3/**'
        exclude 'io/netty/**'
        exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
    }
}

def sanitizedShadedRuntime = files(sanitizeShadedRuntime.flatMap { it.archiveFile })
sanitizedShadedRuntime.builtBy(sanitizeShadedRuntime)

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from({ zipTree(sanitizeShadedRuntime.get().archiveFile.get().asFile) }) {
        exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
    }

    bundledModJars.each { jarName ->
        from("libs/${jarName}") {
            into 'META-INF/jars'
        }
    }
}
